[project]
name = "backend"
version = "0.1.0"
description = "CineView - Movie Review Intelligence System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "matplotlib>=3.10.7",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cineview"
